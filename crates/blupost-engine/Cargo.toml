[package]
name = "blupost-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rust Bluetooth MAP and session engine for Blupost"

[lib]
name = "blupost_engine"
path = "src/lib.rs"

[[bin]]
name = "blupost-engine"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
futures-util = "0.3.33"
getrandom = "0.4.3"
rustix = { version = "1.1.4", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
toml = "1.1.4"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[lints]
workspace = true
